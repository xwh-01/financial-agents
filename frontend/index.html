<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Agents</title>
  <style>
    /* ===== Reset & Variables ===== */
    :root {
      --surface-0: #f5f6f7;
      --surface-1: #ffffff;
      --surface-2: #f7f8fa;
      --surface-3: #edeff2;
      --border: #e5e6eb;
      --border-light: #f0f1f3;
      --text: #1f2329;
      --text-dim: #646a73;
      --text-muted: #8f959e;
      --accent: #3370ff;
      --accent-hover: #2860e1;
      --accent-glow: rgba(51,112,255,0.08);
      --green: #00b578;
      --green-bg: rgba(0,181,120,0.08);
      --amber: #de7800;
      --amber-bg: rgba(222,120,0,0.08);
      --red: #f53f3f;
      --red-bg: rgba(245,63,63,0.08);
      --purple: #7b61ff;
      --purple-bg: rgba(123,97,255,0.08);
      --teal: #14c9c9;
      --teal-bg: rgba(20,201,201,0.08);
      --radius: 10px;
      --radius-sm: 6px;
      --radius-lg: 14px;
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
      --sidebar-w: 220px;
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      --font-mono: "SF Mono", "JetBrains Mono", "Consolas", "Menlo", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html { font-size: 14px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: var(--font); background: var(--surface-0); color: var(--text);
      min-height: 100vh; line-height: 1.6;
    }
    a { color: var(--accent); text-decoration: none; }
    input, select, textarea, button { font-family: inherit; font-size: inherit; outline: none; }
    input, select, textarea {
      height: 36px; padding: 0 12px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface-1); color: var(--text);
      transition: border-color .15s, box-shadow .15s; width: 100%;
    }
    input:hover, select:hover, textarea:hover { border-color: var(--border-active, #c9cdd4); }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    input::placeholder { color: var(--text-muted); }

    /* ===== App Shell ===== */
    .app-shell { display: flex; min-height: 100vh; }

    /* ===== Sidebar ===== */
    .sidebar {
      width: var(--sidebar-w); background: var(--surface-1); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0;
      z-index: 30; overflow-y: auto; transition: width .2s ease;
    }
    .sidebar.collapsed { width: 60px; }
    .sidebar.collapsed .sidebar-brand { padding: 16px 14px; justify-content: center; }
    .sidebar.collapsed .sidebar-name,
    .sidebar.collapsed .sidebar-nav a span,
    .sidebar.collapsed .sidebar-footer a span { display: none; }
    .sidebar.collapsed .sidebar-nav a { justify-content: center; padding: 10px; }
    .sidebar.collapsed .sidebar-nav .nav-divider { margin: 6px 18px; }
    .sidebar.collapsed .sidebar-toggle span { display: none; }
    .sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }

    .sidebar-brand {
      display: flex; align-items: center; gap: 10px;
      padding: 20px 18px 16px; flex-shrink: 0;
    }
    .sidebar-logo {
      width: 32px; height: 32px; border-radius: 8px; background: var(--accent);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800; flex-shrink: 0; letter-spacing: -.04em;
    }
    .sidebar-name { font-size: 15px; font-weight: 700; color: var(--text); white-space: nowrap; }
    .sidebar-nav {
      flex: 1; padding: 4px 10px; display: flex; flex-direction: column; gap: 2px;
    }
    .sidebar-nav a, .sidebar-nav .sidebar-link {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border-radius: 6px; font-size: 14px; font-weight: 500; color: var(--text-dim);
      transition: all .12s; cursor: pointer; text-decoration: none; white-space: nowrap;
    }
    .sidebar-nav a:hover { background: var(--surface-2); color: var(--text); }
    .sidebar-nav a.active, .sidebar-nav a[aria-current] {
      background: var(--accent-glow); color: var(--accent); font-weight: 600;
    }
    .sidebar-nav .nav-icon {
      width: 18px; height: 18px; flex-shrink: 0; color: inherit;
    }
    .sidebar-nav .nav-divider {
      height: 1px; background: var(--border); margin: 6px 12px;
    }

    .sidebar-toggle {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text-muted);
      cursor: pointer; transition: all .12s; user-select: none; border-top: 1px solid var(--border);
      margin: 0 10px;
    }
    .sidebar-toggle:hover { color: var(--text); background: var(--surface-2); }
    .sidebar-toggle svg { width: 18px; height: 18px; flex-shrink: 0; transition: transform .2s ease; }

    .sidebar-footer {
      padding: 4px 10px 10px; flex-shrink: 0;
    }
    .sidebar-footer a {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text-dim);
      transition: all .12s; cursor: pointer; text-decoration: none;
    }
    .sidebar-footer a:hover { background: var(--surface-2); color: var(--red); }

    /* ===== Main Area ===== */
    .main-area {
      flex: 1; margin-left: var(--sidebar-w); min-width: 0;
      display: flex; flex-direction: column; transition: margin-left .2s ease;
    }
    .sidebar.collapsed ~ .main-area { margin-left: 60px; }
    body.auth-mode .sidebar { display: none; }
    body.auth-mode .main-area { margin-left: 0; }
    body.auth-mode .error-box { max-width: 400px; margin: 18px auto 0; }

    /* ===== Page Header ===== */
    .page-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px; gap: 16px; flex-shrink: 0;
      background: var(--surface-1); border-bottom: 1px solid var(--border);
    }
    .page-head-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .page-head-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .page-title { font-size: 18px; font-weight: 600; color: var(--text); white-space: nowrap; }
    .page-subtitle { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
    .page-back {
      display: flex; align-items: center; gap: 4px; color: var(--text-dim); font-size: 13px;
      font-weight: 500; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all .12s;
    }
    .page-back:hover { color: var(--text); background: var(--surface-2); }

    /* ===== Page Body ===== */
    .page-body { padding: 24px 32px 48px; flex: 1; }

    /* ===== Auth (no sidebar) ===== */
    .auth-full {
      flex: 1; display: flex;
      align-items: center; justify-content: center; min-height: 100vh;
    }
    .auth-card {
      width: 400px; background: var(--surface-1); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 40px 36px; box-shadow: var(--shadow-md);
    }
    .auth-card h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .auth-card .auth-desc { color: var(--text-dim); font-size: 13px; margin-bottom: 24px; }
    .auth-kicker { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 10px; }

    /* ===== Common Components ===== */
    .card {
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow-xs);
    }
    .card-pad { padding: 24px; }
    .card + .card { margin-top: 16px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 34px; padding: 0 16px; border-radius: var(--radius-sm); border: none;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all .12s;
      white-space: nowrap; line-height: 1;
    }
    .btn:hover { opacity: .88; }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-hover); opacity: 1; }
    .btn.secondary { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); }
    .btn.secondary:hover { background: var(--surface-3); border-color: var(--border-active, #c9cdd4); }
    .btn.ghost { background: transparent; color: var(--text-dim); }
    .btn.ghost:hover { color: var(--text); background: var(--surface-2); }
    .btn.danger { background: transparent; color: var(--red); }
    .btn.danger:hover { background: var(--red-bg); }
    .btn.block { width: 100%; }
    .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }

    .badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
      border-radius: 4px; font-size: 11px; font-weight: 600;
      line-height: 1.6; white-space: nowrap;
    }
    .badge.blue, .badge.info { color: var(--accent); background: var(--accent-glow); }
    .badge.green, .badge.good { color: var(--green); background: var(--green-bg); }
    .badge.amber, .badge.warn { color: var(--amber); background: var(--amber-bg); }
    .badge.red, .badge.bad { color: var(--red); background: var(--red-bg); }
    .badge.purple { color: var(--purple); background: var(--purple-bg); }
    .badge.teal { color: var(--teal); background: var(--teal-bg); }
    .badge.dim, .badge.neutral { color: var(--text-dim); background: var(--surface-3); }

    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 160px; padding: 40px 24px; color: var(--text-muted); font-size: 13px;
      text-align: center; gap: 8px;
    }
    .empty-state-icon { font-size: 32px; opacity: .5; margin-bottom: 4px; }

    .error-box {
      display: none; padding: 10px 16px; border-radius: var(--radius-sm);
      background: var(--red-bg); border: 1px solid rgba(245,63,63,0.15);
      color: var(--red); font-size: 13px; margin: 16px 32px 0;
    }
    .notice {
      padding: 10px 16px; border-radius: var(--radius-sm);
      background: var(--amber-bg); border: 1px solid rgba(222,120,0,0.12);
      color: var(--amber); font-size: 13px;
    }
    .notice.info {
      background: var(--accent-glow); border-color: rgba(51,112,255,0.15); color: var(--accent);
    }
    .toast {
      position: fixed; right: 20px; bottom: 20px; z-index: 100;
      max-width: 380px; padding: 12px 20px; border-radius: var(--radius);
      background: var(--surface-1); border: 1px solid var(--border);
      font-size: 13px; display: none; box-shadow: var(--shadow-md); color: var(--text);
    }
    .toast.good { border-color: rgba(0,181,120,0.22); color: var(--green); }
    .toast.warn { border-color: rgba(222,120,0,0.22); color: var(--amber); }
    .toast.bad { border-color: rgba(245,63,63,0.22); color: var(--red); }
    .spinner {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2px solid var(--border); border-top-color: var(--accent);
      animation: spin .65s linear infinite; margin: 48px auto;
    }
    .skeleton-stack { display: grid; gap: 12px; }
    .skeleton-line, .skeleton-card {
      position: relative; overflow: hidden; border-radius: var(--radius-sm);
      background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2));
      background-size: 220% 100%; animation: shimmer 1.15s ease-in-out infinite;
    }
    .skeleton-card { height: 84px; border: 1px solid var(--border-light); }
    .skeleton-line { height: 14px; }
    .skeleton-line.short { width: 38%; }
    .skeleton-line.mid { width: 62%; }
    .skeleton-line.long { width: 86%; }
    .progress-overlay {
      position: fixed; inset: 0; z-index: 90; display: none;
      align-items: center; justify-content: center; padding: 24px;
      background: rgba(31,35,41,0.18); backdrop-filter: blur(2px);
    }
    .progress-panel {
      width: min(460px, 100%); border-radius: var(--radius-lg);
      background: var(--surface-1); border: 1px solid var(--border);
      box-shadow: var(--shadow-md); padding: 22px;
    }
    .progress-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .progress-title { font-size: 16px; font-weight: 700; }
    .progress-detail { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
    .progress-time { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
    .progress-steps { display: grid; gap: 8px; margin-top: 18px; }
    .progress-step {
      display: flex; align-items: center; gap: 10px; color: var(--text-muted); font-size: 13px;
    }
    .progress-dot {
      width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border);
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      background: var(--surface-2);
    }
    .progress-step.active { color: var(--accent); font-weight: 600; }
    .progress-step.done { color: var(--green); }
    .progress-step.active .progress-dot {
      border-color: var(--accent); background: var(--accent-glow);
    }
    .progress-step.active .progress-dot::after {
      content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
      animation: pulse .9s ease-in-out infinite;
    }
    .progress-step.done .progress-dot { border-color: var(--green); background: var(--green-bg); }
    .progress-step.done .progress-dot::after {
      content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    }
    .progress-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shimmer { to { background-position: -220% 0; } }
    @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .page-fade { animation: fadeIn .2s ease; }

    /* ===== Table ===== */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 16px; border-bottom: 1px solid var(--border-light); text-align: left; font-size: 13px; }
    th {
      background: var(--surface-2); color: var(--text-dim); font-size: 12px; font-weight: 600;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: 0; }
    tbody tr { transition: background .1s; }
    tbody tr:hover { background: var(--surface-2); }
    td a { color: var(--accent); font-weight: 500; }

    /* ===== Form ===== */
    .form-grid { display: grid; gap: 10px; }
    .form-row { display: flex; gap: 8px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dim); margin-bottom: 4px; }
    .form-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    /* ===== Watchlist Detail ===== */
    .wl-grid { display: grid; grid-template-columns: 200px 1fr; gap: 20px; align-items: start; }
    .wl-side {
      position: sticky; top: 12px; display: flex; flex-direction: column; gap: 2px;
    }
    .wl-side-btn {
      padding: 8px 12px; border-radius: 6px; cursor: pointer;
      font-size: 13px; font-weight: 500; color: var(--text-dim); transition: all .12s;
      display: flex; align-items: center; gap: 8px; border: 1px solid transparent;
    }
    .wl-side-btn:hover { color: var(--text); background: var(--surface-2); }
    .wl-side-btn.active { color: var(--accent); background: var(--accent-glow); font-weight: 600; border-color: rgba(51,112,255,0.12); }
    .wl-side-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .wl-side-dot.blue { background: var(--accent); }
    .wl-side-dot.purple { background: var(--purple); }
    .wl-side-dot.amber { background: var(--amber); }
    .wl-side-dot.green { background: var(--green); }
    .wl-side-dot.teal { background: var(--teal); }
    .wl-side-dot.red { background: var(--red); }

    .wl-cat-0 { --cat-accent: var(--accent); --cat-bg: var(--accent-glow); }
    .wl-cat-1 { --cat-accent: var(--purple); --cat-bg: var(--purple-bg); }
    .wl-cat-2 { --cat-accent: var(--amber); --cat-bg: var(--amber-bg); }
    .wl-cat-3 { --cat-accent: var(--green); --cat-bg: var(--green-bg); }
    .wl-cat-4 { --cat-accent: var(--teal); --cat-bg: var(--teal-bg); }
    .wl-cat-5 { --cat-accent: var(--accent); --cat-bg: var(--accent-glow); }
    .wl-cat-6 { --cat-accent: var(--red); --cat-bg: var(--red-bg); }
    .wl-cat-7 { --cat-accent: var(--amber); --cat-bg: var(--amber-bg); }
    .wl-cat-8 { --cat-accent: var(--purple); --cat-bg: var(--purple-bg); }
    .wl-cat-9 { --cat-accent: var(--teal); --cat-bg: var(--teal-bg); }

    .preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
    .preset-card {
      padding: 14px; border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface-1); cursor: pointer; transition: all .15s;
      display: flex; flex-direction: column; gap: 8px; position: relative; overflow: hidden;
    }
    .preset-card::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--cat-accent, var(--accent)); border-radius: 3px 0 0 3px; opacity: .45;
    }
    .preset-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
    .preset-card:hover::before { opacity: 1; }
    .preset-card.added { opacity: .5; cursor: default; background: var(--surface-2); }
    .preset-card.added:hover { border-color: var(--border); box-shadow: none; }
    .preset-card.pending { border-color: var(--amber); background: var(--amber-bg); }
    .preset-card .card-row { display: flex; align-items: center; gap: 8px; }
    .preset-card .card-title { font-size: 13px; font-weight: 600; line-height: 1.4; color: var(--text); }
    .preset-card .card-code { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
    .preset-card .card-meta { font-size: 11px; color: var(--text-muted); margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
    .preset-card .card-action { font-size: 11px; font-weight: 600; color: var(--accent); }
    .preset-card.added .card-action { color: var(--green); }
    .preset-card.pending .card-action { color: var(--amber); }

    .hero-bundles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .bundle-card {
      padding: 18px; border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface-1); cursor: pointer; transition: all .15s;
    }
    .bundle-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
    .bundle-card .bundle-icon { font-size: 24px; margin-bottom: 10px; display: block; }
    .bundle-card .bundle-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .bundle-card .bundle-desc { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin-bottom: 10px; }
    .bundle-card .bundle-count {
      display: inline-block; padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600; background: var(--accent-glow); color: var(--accent);
    }

    .summary-bar {
      display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
      padding: 12px 18px; border-radius: var(--radius); margin-bottom: 18px;
      background: var(--surface-2); border: 1px solid var(--border); font-size: 13px; color: var(--text-dim);
    }
    .summary-bar .num { font-weight: 700; color: var(--text); }

    .pending-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px;
      background: var(--amber-bg); border: 1px solid rgba(222,120,0,0.15); font-size: 13px;
      color: var(--amber);
    }
    .pending-tag {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 20px; border: 1px solid rgba(222,120,0,0.2); font-size: 12px;
      font-weight: 500; margin: 2px; background: var(--surface-1); color: var(--text);
    }
    .pending-tag .x { cursor: pointer; color: var(--red); margin-left: 4px; font-weight: 700; }

    .item-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .item-tag {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
      border-radius: 20px; border: 1px solid var(--border); font-size: 12px; font-weight: 500;
      background: var(--surface-2); color: var(--text);
    }

    /* ===== Collapsible ===== */
    collapsible { display: block; margin-top: 14px; }
    collapsible .head {
      cursor: pointer; display: flex; align-items: center; gap: 6px;
      padding: 8px 0; font-size: 13px; font-weight: 600; color: var(--text-dim); user-select: none;
    }
    collapsible .head:hover { color: var(--text); }
    collapsible .body { display: none; padding: 8px 0; }
    collapsible.open .body { display: block; }
    collapsible .head::before { content: ">"; font-size: 10px; width: 12px; color: var(--text-muted); display: inline-block; transition: transform .15s; }
    collapsible.open .head::before { transform: rotate(90deg); }

    /* ===== Report ===== */
    .report-box {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px; white-space: pre-wrap; line-height: 1.8; max-height: 480px;
      overflow-y: auto; font-size: 14px; color: var(--text);
    }
    .report-box p { margin: 0 0 10px; white-space: normal; }
    .report-box ul { margin: 6px 0 14px 18px; padding: 0; white-space: normal; }
    .report-box li { margin: 4px 0; }
    .report-box .report-heading {
      margin: 16px 0 8px; font-size: 15px; font-weight: 700; color: var(--text);
      white-space: normal;
    }
    .report-box .report-heading:first-child { margin-top: 0; }
    .report-box .report-spacer { height: 4px; }
    .report-box a { color: var(--accent); word-break: break-all; }
    .report-meta { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }
    .report-meta strong { color: var(--text); font-weight: 600; }
    .chain-summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .chain-summary-item {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);

    .source-list { display: grid; gap: 12px; }

      background: var(--surface-1); transition: border-color .12s, box-shadow .12s;

    .source-index {
      width: 36px; height: 36px; border-radius: 50%; background: var(--surface-2);

      align-items: center; justify-content: center; font-family: var(--font-mono);
      font-size: 12px; font-weight: 700;
    }
    .source-content { min-width: 0; }
    .source-topline {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; margin-bottom: 6px;
    }
    .source-origin {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      font-size: 12px; color: var(--text-dim);
    }
    .source-origin a { font-weight: 600; }
    .source-domain {
      color: var(--text-muted); font-family: var(--font-mono); font-size: 11px;
      padding: 1px 6px; border-radius: 4px; background: var(--surface-2);
    }
    .source-badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .source-card .source-title {
      font-size: 15px; line-height: 1.45; font-weight: 700; margin: 0 0 10px;
    }
    .source-card .source-title a { color: var(--text); }
    .source-card .source-title a:hover { color: var(--accent); }
    .source-block {
      border-left: 3px solid var(--border); padding-left: 10px; margin-top: 8px;
      color: var(--text-dim);
    }
    .source-block-label {
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .02em; margin-bottom: 2px;
    }
    .source-block p { font-size: 13px; line-height: 1.6; margin: 0; }
    .source-card .source-meta {
      display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;
      font-size: 11px; color: var(--text-muted);
    }
    .source-pill {
      display: inline-flex; gap: 5px; align-items: center; max-width: 100%;
      padding: 3px 7px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--surface-2);
    }
    .source-pill span { color: var(--text-muted); }
    .source-pill strong {
      color: var(--text-dim); font-weight: 600; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; max-width: 320px;
    }

    /* ===== Opportunity Scan ===== */
    .opportunity-start {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 22px 24px; margin-bottom: 18px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--surface-1); box-shadow: var(--shadow-xs);
    }
    .opportunity-kicker {

    }

    .opportunity-start p { color: var(--text-dim); font-size: 13px; max-width: 620px; }
    .opportunity-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .opportunity-stats { display: grid; grid-template-columns: repeat(4, minmax(110px, 1fr)); gap: 8px; flex: 1; }
    .opportunity-stat {
      padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface-1); display: flex; justify-content: space-between; align-items: center;
      gap: 10px; font-size: 12px; color: var(--text-dim);
    }
    .opportunity-stat strong { color: var(--text); font-size: 15px; font-weight: 700; }
    .opportunity-list { display: grid; gap: 12px; }
    .opportunity-card {
      display: grid; grid-template-columns: 46px 1fr; gap: 14px; padding: 16px;
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-1);
      box-shadow: var(--shadow-xs);
    }
    .opportunity-rank {
      width: 36px; height: 36px; border-radius: 6px; background: var(--accent-glow);
      color: var(--accent); display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono); font-size: 12px; font-weight: 700;
    }
    .opportunity-main { min-width: 0; }
    .opportunity-topline { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .opportunity-topline h3 { font-size: 18px; line-height: 1.2; margin: 0 0 8px; }
    .opportunity-topline h3 span {
      margin-left: 8px; color: var(--text-muted); font-size: 13px; font-weight: 500;
    }
    .opportunity-rationale { color: var(--text); font-size: 13px; line-height: 1.7; margin: 0 0 12px; }
    .opportunity-metrics {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;
      font-size: 11px; color: var(--text-muted);
    }
    .opportunity-points {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 8px;
      font-size: 12px; color: var(--text-dim);
    }
    .opportunity-points strong { color: var(--text); margin-right: 2px; }
    .opportunity-points span {
      padding: 3px 8px; border-radius: 4px; background: var(--surface-2);
      border: 1px solid var(--border-light);
    }
    .opportunity-points.risk span { background: var(--amber-bg); border-color: rgba(222,120,0,0.14); }

    /* ===== Section ===== */
    .section-title {
      font-size: 13px; font-weight: 600; color: var(--text-dim); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::after {
      content: ""; flex: 1; height: 1px; background: var(--border);
    }

    /* ===== Scrollbar ===== */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d0d3d8; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #b0b3b8; }

    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .sidebar { width: 60px; }
      .sidebar .sidebar-brand { padding: 16px 14px; justify-content: center; }
      .sidebar .sidebar-name,
      .sidebar .sidebar-nav a span,
      .sidebar .sidebar-footer a span,
      .sidebar .sidebar-toggle span { display: none; }
      .sidebar .sidebar-nav a { justify-content: center; padding: 10px; }
      .sidebar .sidebar-nav .nav-divider { margin: 6px 18px; }
      .sidebar-toggle { justify-content: center; margin: 0 8px; }
      .main-area,
      .sidebar.collapsed ~ .main-area { margin-left: 60px; }
      .page-head { padding: 16px 20px; }
      .page-body { padding: 16px 20px 40px; }
      .error-box { margin: 12px 20px 0; }
      .auth-full { min-height: 100vh; padding: 18px; }
      .auth-card { width: 100%; max-width: 380px; padding: 30px 28px; }
      .wl-grid { grid-template-columns: 1fr; }
      .wl-side { position: static; flex-direction: row; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
      .wl-side-btn { padding: 6px 10px; font-size: 12px; }
      .source-card { grid-template-columns: 1fr; }
      .opportunity-start { align-items: stretch; flex-direction: column; }
      .opportunity-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; }
      .opportunity-card { grid-template-columns: 1fr; }
      .opportunity-rank { width: auto; height: 24px; justify-content: flex-start; padding: 0 8px; }
      .opportunity-topline { flex-direction: column; }
      .source-index { width: auto; height: 24px; border-radius: 4px; justify-content: flex-start; padding: 0 8px; }
      .source-topline { flex-direction: column; }
      .source-badges { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-logo">FA</span>
        <span class="sidebar-name">Financial Agents</span>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
      <div class="sidebar-toggle" id="sidebarToggle" title="Collapse sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Collapse</span>
      </div>
      <div class="sidebar-footer" id="sidebarFooter"></div>
    </aside>
    <main class="main-area">
      <div class="error-box" id="errorBox"></div>
      <div id="mainContent"></div>
    </main>
  </div>

  <script src="js/api.js?v=8"></script>
  <script src="js/presets.js?v=7"></script>
  <script src="js/app.js?v=12"></script>

</html>
